server {
    listen 8443 ssl;
    server_name _;
    
    # Disable absolute redirects (avoids 301 on POST without trailing slash)
    absolute_redirect off;

    ssl_certificate /etc/ssl/certs/nginx-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;

    root /var/www/html/portal-shell;
    index index.html;

    # shell-app assets
    location /home/ {
        alias /var/www/html/portal-shell/;
        try_files $uri $uri/ /index.html;
    }

    location /home/assets/ {
        alias /var/www/html/portal-shell/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # risk-app static files
    location /risk/ {
        alias /var/www/html/risk/;
        try_files $uri $uri/ /risk/index.html;
    }

    location /risk/assets/ {
        alias /var/www/html/risk/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # mkt-app static files
    location /mkt/ {
        alias /var/www/html/mkt/;
        try_files $uri $uri/ /mkt/index.html;
    }

    location /mkt/assets/ {
        alias /var/www/html/mkt/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # dex-app static files
    location /dex/ {
        alias /var/www/html/dex/;
        try_files $uri $uri/ /dex/index.html;
    }

    location /dex/assets/ {
        alias /var/www/html/dex/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # admin-app static files
    location /admin/ {
        alias /var/www/html/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    location /admin/assets/ {
        alias /var/www/html/admin/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # dmt-app static files
    location /dmt/ {
        alias /var/www/html/dmt/;
        try_files $uri $uri/ /dmt/index.html;
    }

    location /dmt/assets/ {
        alias /var/www/html/dmt/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # dfd-app static files
    location /dfd/ {
        alias /var/www/html/dfd/;
        try_files $uri $uri/ /dfd/index.html;
    }

    location /dfd/assets/ {
        alias /var/www/html/dfd/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # asset-app static files
    location /asset/ {
        alias /var/www/html/asset/;
        try_files $uri $uri/ /asset/index.html;
    }

    # touch-app static files
    location /touch/ {
        alias /var/www/html/touch/;
        try_files $uri $uri/ /touch/index.html;
    }

    # data_community (客户360)
    location /community/ {
        alias /var/www/html/community/;
        try_files $uri $uri/ /community/index.html;
    }

    location /community/assets/ {
        alias /var/www/html/community/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # ProductOverview API -> Mock Server (backend 8080 has empty data due to Neo4j failure)
    location /api/v1/ {
        proxy_pass http://localhost:8081/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Access-Control-Allow-Origin *;
    }

    # Mock API proxy
    location /api/external-data-evaluation/ {
        proxy_pass http://localhost:8081/api/external-data-evaluation/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Access-Control-Allow-Origin *;
    }

    location /budget/ {
        proxy_pass http://localhost:8081/budget/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Access-Control-Allow-Origin *;
    }

    location /external-data-task {
        proxy_pass http://localhost:8081/external-data-task;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Access-Control-Allow-Origin *;
    }
    
    location /budget {
        proxy_pass http://localhost:8081/budget;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Access-Control-Allow-Origin *;
    }

    location = /index.html {
        add_header Access-Control-Allow-Origin "*";
    }
}
